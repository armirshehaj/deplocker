# Self-contained CI stack: builds the backend's `test` stage and runs pytest
# against a throwaway Postgres. Redis is faked in-process (see
# tests/integration/conftest.py), so no cache service is needed.
#
#   docker compose -f docker-compose.test.yml up \
#       --build --exit-code-from api --abort-on-container-exit

# Distinct project name so this stack never adopts or prunes the dev containers.
name: deplocker-test

services:

  api:
    build:
      context: ./backend
      target: test
    image: deplocker-ci-api
    # No container_name: it is a global namespace, so a fixed one collides with
    # leftovers and blocks concurrent CI runs. Compose derives names per project.
    command: ["uv", "run", "pytest", "tests/", "-v"]
    environment:
      # Postgres — points at the ephemeral ci-postgres below, not the dev instance.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST: ci-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: deplocker
      TEST_DB: deplocker_test

      ENVIRONMENT: dev
      DEV_FRONTEND_URL: http://localhost:5173
      PROD_FRONTEND_URL: https://deplocker.armir.dev
      DEV_PUBLIC_URL: http://localhost:8080
      PROD_PUBLIC_URL: https://api.deplocker.armir.dev

      # JWT — throwaway value; only email-confirmation links are signed with it.
      SECRET_KEY: 379afe51b95194f76028340e1ab89cc309cd52e9a1d018f986bc3e857257471d
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRES_MINUTES: 1440

      # Redis — settings must validate, but the client is monkeypatched to fakeredis.
      REDIS_HOST: redis-stack
      REDIS_PORT: 6379
      REDIS_PASSWORD: deplocker_redis

      # Email — no SMTP dialogue happens during tests.
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: 587
      SENDER_EMAIL_ADDRESS: deplocker@example.com
      EMAIL_HOST_PASSWORD: gmail_app_password

      # Google OAuth2 — placeholders; the tests mock the provider.
      GOOGLE_CLIENT_ID: your-client-id.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: your-client-secret
      GOOGLE_AUTH_URL: https://accounts.google.com/o/oauth2/auth
      GOOGLE_TOKEN_URL: https://oauth2.googleapis.com/token
      GOOGLE_USER_INFO_URL: https://www.googleapis.com/oauth2/v3/userinfo

      # GitHub OAuth2 — placeholders; the tests mock the provider.
      GITHUB_CLIENT_ID: your-github-client-id
      GITHUB_CLIENT_SECRET: your-github-client-secret
      GITHUB_AUTH_URL: https://github.com/login/oauth/authorize
      GITHUB_TOKEN_URL: https://github.com/login/oauth/access_token
      GITHUB_USER_INFO_URL: https://api.github.com/user
      GITHUB_USER_EMAILS_URL: https://api.github.com/user/emails
    depends_on:
      ci-postgres:
        condition: service_healthy

  ci-postgres:
    image: postgres:18.1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deplocker
    # 01-create-test-table.sql creates TEST_DB (deplocker_test) on first boot.
    volumes:
      - ./backend/scripts/init-scripts:/docker-entrypoint-initdb.d
    # No `ports:` — the dev stack already owns 5435; CI reaches this over the
    # compose network. Storage is the container layer, so each run starts clean.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s
