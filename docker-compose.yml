# Development stack for the whole project. The `ui` and `caddy` services sit
# behind a profile, so a bare `docker compose up` brings up the backend only. In
# production, docker-compose.prod.yml puts Caddy on the production domain, over
# HTTPS.
#
#   docker compose up                        # backend
#   docker compose --profile frontend up -d  # backend + ui + caddy
name: deplocker

services:

  # Backend services
  api:
    build: ./backend
    # `make deploy-cd` sets IMAGE_TAG to the deployed commit's SHA
    image: deplocker-api:${IMAGE_TAG:-latest}
    container_name: deplocker-api
    pull_policy: never
    env_file: /etc/deplocker/.env
    environment:
      # Frontend origin used by the backend for email confirmation links and
      # passkey checks. Pass-through form (no value): forwarded only when set
      # on the host, so `make start-dev` can override it to the Vite dev server
      # (http://localhost:5173). On a bare `up` the key is not injected and the
      # value from the env_file above stays in effect.
      - DEV_FRONTEND_URL
    volumes:
      - ./backend:/app
      - /app/.venv   # keep the image's venv; don't let the bind mount above hide it
    ports:
      # Where the Vite dev server passes /api
      - "127.0.0.1:8080:8080"
    # Reloads on every change to the bind-mounted source
    command: ["uv", "run", "--no-sync", "uvicorn", "app.main:app", "--host", "0.0.0.0",
              "--port", "8080", "--reload", "--reload-exclude", "app/logs/*"]
    depends_on:
      postgres:
        condition: service_healthy
      redis-stack:
        condition: service_healthy
    healthcheck:
      # -f: /health answers 503 when the database or cache is unreachable
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
      # Probe often while starting, so `up --wait` returns once api is ready
      # instead of after the first 30s interval
      start_interval: 2s

  postgres:
    image: postgres:18.1
    container_name: deplocker_postgres
    env_file: /etc/deplocker/.env
    ports:
      # Host access for database clients such as psql; the stack itself connects
      # over the compose network. 5435 leaves 5432 to a Postgres on the host
      - "5435:5432"
    volumes:
      - ./backend/scripts/init-scripts:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER" ]
      interval: 5s
      timeout: 20s
      retries: 5
      start_period: 30s

  redis-stack:
    image: redis/redis-stack:latest
    container_name: deplocker_redis
    env_file: /etc/deplocker/.env
    ports:
      # Host access for redis-cli, as on postgres. 6380 leaves 6379 to a Redis on
      # the host
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: ["sh", "-c", "redis-stack-server --requirepass $$REDIS_PASSWORD"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Frontend services, not started by a bare `docker compose up`; enable with
  # --profile frontend
  ui:
    profiles: ["frontend"]
    build: ./frontend
    pull_policy: never
    image: deplocker-ui:${IMAGE_TAG:-latest}
    container_name: deplocker-ui
    restart: always

  caddy:
    profiles: ["frontend"]
    image: caddy:2.11
    container_name: deplocker_caddy
    environment:
      # Site address for caddy/Caddyfile
      SITE_ADDRESS: ":8082"
    ports:
      # The production build of the web app and the API, at localhost:8082
      # (`make start-prod`)
      - "8082:8082"
    volumes:
      - ./caddy:/etc/caddy:ro

volumes:
  pgdata:
  redis_data: