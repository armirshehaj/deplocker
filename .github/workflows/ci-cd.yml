name: Deplocker CI/CD

on:
  push:
    branches:
      - '**'

jobs:
  ci:
    name: Build & Test
    runs-on: self-hosted
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        env:
          BEFORE: ${{github.event.before}}
        run: .github/scripts/detect-changes.sh "$BEFORE"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend
        run: make frontend-install-ci

      - name: Lint & typecheck frontend
        if: steps.changes.outputs.frontend
        run: make frontend-lint-ci

      - name: Run frontend tests
        if: steps.changes.outputs.frontend
        run: make frontend-test-ci

      - name: Lint & typecheck backend
        if: steps.changes.outputs.backend
        run: make backend-lint-ci

      - name: Check backend migrations
        if: steps.changes.outputs.backend
        run: make backend-migrations-ci

      - name: Run backend tests
        if: steps.changes.outputs.backend
        run: make backend-test-ci

      - name: Cleanup
        if: always()
        run: make backend-clean-ci

      - name: Build images
        run: make build-ci IMAGE_SHA=${{github.sha}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Push images
        run: |
          make publish-ci \
            IMAGE_OWNER=${{github.repository_owner}} \
            IMAGE_SHA=${{github.sha}}

  cd:
    name: Deploy to production
    runs-on: self-hosted
    # Deploys only a commit whose ci job passed
    needs: ci
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The runner is the production host, so ci already built deplocker-api
      # and deplocker-ui locally, tagged with this commit's SHA; deploy-cd runs
      # those images. Production secrets are provisioned on the host, never by
      # this workflow.
      - name: Deploy
        run: make deploy-cd IMAGE_SHA=${{github.sha}}
