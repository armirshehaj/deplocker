name: Deplocker CI/CD

on:
  push:
    branches:
      - '**'

jobs:
  ci:
    name: Build & Test
    # GitHub's runners, unless the repository variable CI_RUNNER names others,
    # such as self-hosted for the production server
    runs-on: ${{vars.CI_RUNNER || 'ubuntu-latest'}}
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed components
        id: changes
        env:
          BEFORE: ${{github.event.before}}
        run: .github/scripts/detect-changes.sh "$BEFORE"

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.frontend
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: steps.changes.outputs.frontend
        run: make frontend-install-ci

      - name: Lint & typecheck frontend
        if: steps.changes.outputs.frontend
        run: make frontend-lint-ci

      - name: Run frontend tests
        if: steps.changes.outputs.frontend
        run: make frontend-test-ci

      # uv runs the backend's lint; the production server has it installed
      - uses: astral-sh/setup-uv@v10.3.3
        if: steps.changes.outputs.backend && runner.environment == 'github-hosted'

      - name: Lint & typecheck backend
        if: steps.changes.outputs.backend
        run: make backend-lint-ci

      - name: Check backend migrations
        if: steps.changes.outputs.backend
        run: make backend-migrations-ci

      - name: Run backend tests
        if: steps.changes.outputs.backend
        run: make backend-test-ci

      - name: Cleanup
        if: always()
        run: make backend-clean-ci

      - name: Build images
        run: make build-ci IMAGE_SHA=${{github.sha}}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Push images
        run: |
          make publish-ci \
            IMAGE_OWNER=${{github.repository_owner}} \
            IMAGE_SHA=${{github.sha}}

  cd:
    name: Deploy to production
    runs-on: self-hosted
    # Deploys only a master commit whose ci job passed, and only while ci runs
    # on the production server
    needs: ci
    if: github.ref == 'refs/heads/master' && vars.CI_RUNNER == 'self-hosted'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # The runner is the production host, so ci already built deplocker-api
      # and deplocker-ui locally, tagged with this commit's SHA; deploy-cd runs
      # those images. Production secrets are provisioned on the host, never by
      # this workflow.
      - name: Deploy
        run: make deploy-cd IMAGE_SHA=${{github.sha}}
