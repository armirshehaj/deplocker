server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }
    # Browsers check with the server before reusing a saved copy of the app's
    # page, so every visit loads the latest deployed version
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
